name: Admin Role Checks
on:
  push:
    branches: [feature/admin-role-management]
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - '.github/workflows/admin-role-check.yml'
jobs:
  api-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pending_posts_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d pending_posts_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEON_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      - run: npm test -- --runInBand entry-guides.spec.ts pending-posts.spec.ts notification-email.service.spec.ts moderation.service.spec.ts moderation.controller.spec.ts upload-gate.spec.ts post-images.spec.ts posts.service.spec.ts budget-v3.spec.ts users.service.spec.ts trips.controller.spec.ts
      - name: Verify additive migration and publication against isolated PostgreSQL
        env:
          NEON_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/pending_posts_test?schema=public
          PENDING_POST_TEST_DATABASE: '1'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          git show "$BASE_SHA":apps/api/prisma/schema.prisma > /tmp/before-pending.prisma
          npx prisma migrate diff --from-empty --to-schema /tmp/before-pending.prisma --script > /tmp/before-pending.sql
          echo 'CREATE EXTENSION IF NOT EXISTS postgis;' > /tmp/ci-extensions.sql
          npx prisma db execute --file /tmp/ci-extensions.sql
          npx prisma db execute --file /tmp/before-pending.sql
          if ! grep -q '^model PendingPost {' /tmp/before-pending.prisma; then
            npx prisma db execute --file prisma/migrations/20261029180000_pending_post_review/migration.sql
          fi
          node scripts/ci-moderation-constraints.cjs
          npx prisma db execute --file /tmp/moderation-checks.sql
          npx prisma db execute --file prisma/migrations/20261029190000_reviewed_case_status/migration.sql
          if ! grep -q '^model CountryEntryGuide {' /tmp/before-pending.prisma; then
            npx prisma db execute --file prisma/migrations/20261030100000_country_entry_guides/migration.sql
          else
            node scripts/ci-entry-guide-seeds.cjs
            npx prisma db execute --file /tmp/ci-entry-guides-seeds.sql
          fi
          npm test -- --runInBand entry-guides.spec.ts pending-posts.integration.spec.ts
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
