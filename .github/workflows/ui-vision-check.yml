name: UI Vision Web Check
on:
  push:
    branches: [feature/ui-vision-video-alignment]
  pull_request:
    branches: [stage]
    paths:
      - 'apps/web/**'
      - '.github/workflows/ui-vision-check.yml'
jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
