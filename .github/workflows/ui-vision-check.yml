name: UI Vision Web Check
on:
  push:
    branches: [feature/ui-vision-video-alignment]
  pull_request:
    branches: [stage]
    paths:
      - 'apps/web/**'
      - '.github/workflows/ui-vision-check.yml'
jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
  email-settings-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/email-notifications.spec.ts --project=chromium
        env:
          CI: 'true'
          VITE_API_BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-layout-previews
          path: |
            /tmp/activity-email-*.png
            /tmp/email-settings-*.png
          if-no-files-found: ignore
